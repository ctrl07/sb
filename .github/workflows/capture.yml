name: Capture

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "URLs to capture (one per line)"
        required: true
        type: string

jobs:
  capture:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          "${{ github.event.inputs.urls }}" -split '\s+' | Where-Object { $_ } | Out-File -FilePath suyog\urls.txt -Encoding utf8
      - shell: pwsh
        run: python suyog\case.py
      - uses: actions/upload-artifact@v4
        with:
          name: captures
          path: |
            suyog/photos/
            suyog/pdfs/
            suyog/data.csv
