name: Capture

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "URLs to capture (one per line)"
        required: true
        type: string

jobs:
  capture:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: printf '%s\n' "${{ github.event.inputs.urls }}" > suyog/urls.txt
      - shell: bash
        run: |
          .venv/Scripts/pip install -r requirements.txt
          .venv/Scripts/python suyog/case.py
      - uses: actions/upload-artifact@v4
        with:
          name: captures
          path: |
            suyog/photos/
            suyog/pdfs/
            suyog/data.csv
