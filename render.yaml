services:
  - type: web
    name: screenshot-service
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: PORT
        value: "8000"
      - key: MAX_URLS
        value: "10"
      - key: JOBS_DIR
        value: /tmp/sb_jobs
      - key: API_KEY
        generateValue: false   # set manually in Render dashboard if you want auth
